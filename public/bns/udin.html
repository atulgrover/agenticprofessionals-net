<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>openIBC - Statutory UDIN Verification Registry</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .udin-container {
      max-width: 680px;
      margin: 60px auto;
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .udin-input {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      border: 1px solid var(--slate-300);
      padding: 0 16px;
      font-size: 15px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      margin-top: 12px;
      transition: border-color 0.15s;
    }
    .udin-input:focus {
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }
    .verify-btn {
      width: 100%;
      height: 44px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      margin-top: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .verify-btn:hover {
      background: #047857;
    }
    .result-card {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--slate-200);
      background: var(--slate-50);
      display: none;
    }
    .result-card.success {
      display: block;
      border-color: #a7f3d0;
      background: #ecfdf5;
    }
    .result-card.error {
      display: block;
      border-color: #fecdd3;
      background: #fff1f2;
    }
  </style>
</head>

    <div class="actions-tray">

  <div class="udin-container">
    <div style="text-align:center;margin-bottom:24px;">
      <span style="background:#ecfdf5;color:#059669;font-weight:700;font-size:11px;padding:4px 10px;border-radius:999px;font-family:monospace;">
        IMMUTABLE NEON REGISTRY
      </span>
      <h1 style="font-size:22px;font-weight:800;color:#0f172a;margin-top:10px;">
        Statutory UDIN Verification
      </h1>
      <p style="font-size:13px;color:#64748b;margin-top:6px;">
        Verify Section 29A, Resolution Plan or Form G statutory seals against the master ledger in 2ms.
      </p>
    </div>

    <form id="udin-form">
      <label style="font-size:12px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:0.5px;">
        18-Digit Unique Document Identification Number (UDIN)
      </label>
      <input type="text" id="udin-input" class="udin-input" placeholder="e.g. UDIN-2026-NCLT-987654" required />
      <button type="submit" class="verify-btn" id="verify-btn">Verify Statutory Seal &rarr;</button>
    </form>

    <div id="result-card" class="result-card"></div>
  </div>

  <script>
    const form = document.getElementById('udin-form');
    const input = document.getElementById('udin-input');
    const btn = document.getElementById('verify-btn');
    const resultCard = document.getElementById('result-card');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;

      btn.textContent = 'Querying Master Ledger...';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/udin/verify?udin=${encodeURIComponent(val)}`);
        const data = await res.json();

        if (data.verified) {
          resultCard.className = 'result-card success';
          resultCard.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;color:#059669;font-weight:800;font-size:14px;margin-bottom:8px;">
              <span>&#10004;</span> STATUTORY RECORD VERIFIED &amp; COMPLIANT
            </div>
            <div style="font-size:12px;color:#334155;line-height:1.6;">
              <div><strong>UDIN:</strong> <span style="font-family:monospace;">${data.udin}</span></div>
              <div><strong>Document Type:</strong> ${data.document_type || 'Form G EOI Verification'}</div>
              <div><strong>Applicant Entity:</strong> ${data.pra_entity_name || 'Verified Qualified Resolution Applicant'}</div>
              <div><strong>Target Debtor:</strong> ${data.target_debtor_name || 'CIRP Corporate Debtor'}</div>
              <div><strong>NCLT Bench:</strong> ${data.nclt_bench || 'Principal Bench, New Delhi'}</div>
              <div><strong>SHA-256 Seal:</strong> <span style="font-family:monospace;font-size:10px;">${data.sha256_hash || 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'}</span></div>
            </div>
          `;
        } else {
          resultCard.className = 'result-card error';
          resultCard.innerHTML = `
            <div style="color:#e11d48;font-weight:800;font-size:14px;margin-bottom:6px;">
              &#10006; Record Not Found in Statutory Ledger
            </div>
            <div style="font-size:12px;color:#475569;">
              ${data.message || 'No matching statutory record was located for this identification number.'}
            </div>
          `;
        }
      } catch (err) {
        resultCard.className = 'result-card error';
        resultCard.innerHTML = `<div style="color:#e11d48;font-size:12px;">Failed to verify UDIN. Coordinator offline.</div>`;
      } finally {
        btn.textContent = 'Verify Statutory Seal \u2192';
        btn.disabled = false;
      }
    });

    // Auto-verify if ?udin= is in URL
    const urlParams = new URLSearchParams(window.location.search);
    const qUdin = urlParams.get('udin');
    if (qUdin) {
      input.value = qUdin;
      form.dispatchEvent(new Event('submit'));
    }
  </script>
</body>
